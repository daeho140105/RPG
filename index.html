<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>검의 수집가 2.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#151b29;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:12px;background:#222d42;color:#ffdc83}
h1{margin:5px;font-size:25px}
#stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:10px;font-size:14px}
#game{display:block;width:min(96vw,800px);height:auto;margin:auto;border:4px solid #667b65;border-radius:10px;background:#7ab65d;image-rendering:pixelated;touch-action:none}
#status{margin:10px;color:#ffe18b;min-height:22px}
button{background:#6954ce;color:white;border:0;border-radius:9px;padding:11px 15px;margin:4px;font-size:14px;cursor:pointer}
button:disabled{opacity:.4}
.panel{max-width:800px;margin:12px auto;padding:12px;background:#253149;border-radius:12px}
#controls{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;max-width:420px;margin:10px auto}
#controls button{width:65px;height:52px;font-size:20px;touch-action:none}
#controls .action{width:100px;font-size:14px}
#dex{font-size:14px;line-height:2}
small{color:#c6d1e1}
</style>
</head>
<body>
<header>
<h1>⚔️ 검의 수집가 2.0 ⚔️</h1>
<small>검을 뽑고 몬스터를 잡아 최강의 수집가가 되자!</small>
</header>

<div id="stats">
<span>💰 코인: <b id="coins">100</b></span>
<span>⭐ 레벨: <b id="level">1</b></span>
<span>❤️ 체력: <b id="hp">100</b>/100</span>
<span>⚔️ 검: <b id="sword">나무검</b></span>
</div>

<canvas id="game" width="800" height="480"></canvas>
<div id="status">숲을 탐험해 몬스터를 찾아보세요!</div>

<div id="controls">
<div>
<button data-dir="up">⬆️</button><br>
<button data-dir="left">⬅️</button>
<button data-dir="down">⬇️</button>
<button data-dir="right">➡️</button>
</div>
<div>
<button class="action" id="attack">⚔️ 공격</button><br>
<button class="action" id="capture">🪄 포획</button>
<button class="action" id="explore">🌲 탐험</button>
</div>

<div class="panel">
<h3>🎰 검 뽑기 기계</h3>
<p>10코인으로 랜덤 검을 뽑으세요!</p>
<button id="draw">검 뽑기 (10코인)</button>
<p id="drawResult">현재 장착 검: 나무검</p>
</div>

<div class="panel">
<h3>📖 몬스터 도감</h3>
<p id="dex">아직 포획한 몬스터가 없습니다.</p>
</div>

<div class="panel">
<h3>📜 게임 안내</h3>
<p>PC: 방향키 또는 WASD로 이동, 스페이스바로 공격</p>
<p>스마트폰: 화면 아래 방향키와 공격 버튼 사용</p>
<p>몬스터를 약하게 만든 뒤 포획 버튼을 누르세요!</p>
<button id="heal">❤️ 체력 회복 (20코인)</button>
<button id="save">💾 저장하기</button>
<button id="reset">새 게임</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const $=id=>document.getElementById(id);

let coins=100,level=1,xp=0,hp=100;
let sword={name:"나무검",power:10};
let owned=[];
let caught=[];
let keys={};
let monster=null;
let attackTimer=0;
let invincible=0;
let message="숲을 탐험해 몬스터를 찾아보세요!";
let lastTime=0;

const player={x:400,y:250,speed:190,face:1};
const trees=[
 [70,70],[180,100],[650,80],[740,180],
 [100,390],[690,390],[280,60],[540,400],
 [60,240],[750,300]
];

const swords=[
 {name:"나무검",power:10,chance:40},
 {name:"강철검",power:25,chance:28},
 {name:"화염검",power:45,chance:17},
 {name:"번개검",power:70,chance:9},
 {name:"드래곤 슬레이어",power:100,chance:5},
 {name:"창조의 검",power:150,chance:1}
];

const species=[
 {name:"슬라임",emoji:"🟢",hp:40,level:1},
 {name:"불꽃 여우",emoji:"🦊",hp:65,level:2},
 {name:"숲의 정령",emoji:"🌳",hp:90,level:3},
 {name:"아이스 드래곤",emoji:"🐉",hp:150,level:5},
 {name:"어둠의 군주",emoji:"👹",hp:220,level:8}
];

function say(t){message=t;$("status").textContent=t;}

function updateUI(){
 $("coins").textContent=coins;
 $("level").textContent=level;
 $("hp").textContent=Math.max(0,Math.floor(hp));
 $("sword").textContent=sword.name;
 $("drawResult").textContent="현재 장착 검: "+sword.name+" (힘 "+sword.power+")";
 $("dex").textContent=caught.length?
 caught.map(n=>" "+n).join(" / "):
 "아직 포획한 몬스터가 없습니다.";
}

function spawnMonster(){
 let pool=species.filter(s=>s.level<=level+2);
 let s=pool[Math.floor(Math.random()*pool.length)];
 monster={
  ...s,
  x:80+Math.random()*640,
  y:70+Math.random()*340,
  maxHp:s.hp+level*5,
  hp:s.hp+level*5,
  alive:true,
  attackWait:0
 };
 say(monster.name+"이(가) 나타났다!");
}

function drawBackground(){
 ctx.fillStyle="#79b65d";
 ctx.fillRect(0,0,800,480);

 ctx.fillStyle="#92c96b";
 for(let i=0;i<800;i+=40){
  for(let j=0;j<480;j+=40){
   if((i+j)%80===0)ctx.fillRect(i,j,3,3);
  }
 }

 ctx.fillStyle="#c4a477";
 ctx.fillRect(0,220,800,65);
 ctx.fillRect(365,0,70,480);

 ctx.fillStyle="#9b835b";
 for(let i=0;i<800;i+=40){
  ctx.fillRect(i,248,15,3);
 }
 for(let j=0;j<480;j+=40){
  ctx.fillRect(397,j,3,15);
 }

 trees.forEach(([x,y])=>{
  ctx.fillStyle="#65462d";
  ctx.fillRect(x-6,y+12,12,22);
  ctx.fillStyle="#267344";
  ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#3b9550";
  ctx.beginPath();ctx.arc(x-8,y-8,13,0,Math.PI*2);ctx.fill();
 });
}

function drawCharacter(x,y,emoji,size=30){
 ctx.font=size+"px Arial";
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillText(emoji,x,y);
}

function drawBar(x,y,w,h,value,max){
 ctx.save();
 ctx.fillStyle="#222";
 ctx.fillRect(x-2,y-2,w+4,h+4);
 ctx.fillStyle="#e53935";
 ctx.fillRect(x,y,w,h);
 ctx.fillStyle="#39e75f";
 ctx.fillRect(x,y,w*Math.max(0,Math.min(1,value/max)),h);
 ctx.strokeStyle="#ffffff";
 ctx.lineWidth=2;
 ctx.strokeRect(x,y,w,h);
 ctx.restore();
}


function render(){
 drawBackground();

 if(monster&&monster.alive){
  drawCharacter(monster.x,monster.y,monster.emoji,35);
  ctx.fillStyle="white";
  ctx.font="13px Arial";
  ctx.textAlign="center";
  ctx.fillText(monster.name,monster.x,monster.y-30);
  drawBar(monster.x-24,monster.y-23,48,6,monster.hp,monster.maxHp);
ctx.fillStyle="white";
ctx.font="bold 14px Arial";
ctx.textAlign="center";
ctx.strokeStyle="#222";
ctx.lineWidth=3;
ctx.strokeText(
 Math.ceil(monster.hp)+" / "+monster.maxHp,
 monster.x,
 monster.y-37
);
ctx.fillText(
 Math.ceil(monster.hp)+" / "+monster.maxHp,
 monster.x,
 monster.y-37
);
 }

 drawCharacter(player.x,player.y,"🧑‍🌾",34);

 if(attackTimer>0){
  ctx.strokeStyle="#fff17b";
  ctx.lineWidth=6;
  ctx.beginPath();
  ctx.arc(player.x+player.face*35,player.y,30,-1,1);
  ctx.stroke();
 }
}

function move(dt){
 let dx=0,dy=0;
 if(keys.left||keys.a)dx--;
 if(keys.right||keys.d)dx++;
 if(keys.up||keys.w)dy--;
 if(keys.down||keys.s)dy++;
 if(dx||dy){
  let length=Math.hypot(dx,dy);
  player.x+=dx/length*player.speed*dt;
  player.y+=dy/length*player.speed*dt;
  if(dx)player.face=Math.sign(dx);
 }
 player.x=Math.max(25,Math.min(775,player.x));
 player.y=Math.max(25,Math.min(455,player.y));
}

function attack(){
 if(!monster||!monster.alive){
  say("공격할 몬스터가 없습니다. 먼저 탐험하세요!");
  return;
 }
 if(attackTimer>0)return;

 let distance=Math.hypot(player.x-monster.x,player.y-monster.y);
 if(distance>85){
  say("몬스터에게 조금 더 가까이 다가가세요!");
  return;
 }

 attackTimer=.22;
 monster.hp-=sword.power+level*2;
 say(monster.name+"에게 "+(sword.power+level*2)+"의 피해!");

 if(monster.hp<=0){
  monster.hp=0;
  monster.alive=false;
  coins+=10+monster.level*5;
  xp+=20+monster.level*10;
  say(monster.name+"을(를) 쓰러뜨렸다! 코인과 경험치 획득!");
  checkLevel();
 }
 updateUI();
}

function checkLevel(){
 while(xp>=level*100){
  xp-=level*100;
  level++;
  hp=100;
  say("🎉 레벨 업! 현재 레벨 "+level);
 }
}

function capture(){
 if(!monster||!monster.alive){
  say("포획할 몬스터가 없습니다!");
  return;
 }
 let distance=Math.hypot(player.x-monster.x,player.y-monster.y);
 if(distance>100){
  say("몬스터 가까이 다가가세요!");
  return;
 }
 if(monster.hp>monster.maxHp*.4){
  say("몬스터의 체력을 40% 이하로 낮춰야 포획할 수 있어!");
  return;
 }
 let chance=Math.min(95,45+sword.power/3+
 (1-monster.hp/monster.maxHp)*35);

 if(Math.random()*100<chance){
  if(!caught.includes(monster.name)){
   caught.push(monster.name);
  }
  coins+=15;
  xp+=15;
  say("🎉 "+monster.name+" 포획 성공!");
  monster.alive=false;
  checkLevel();
 }else{
  say("포획 실패! 조금 더 약하게 만들어 보세요.");
 }
 updateUI();
}

function drawSword(){
 if(coins<10){say("코인이 부족합니다!");return;}
 coins-=10;
 let r=Math.random()*100;
 let total=0;
 for(let s of swords){
  total+=s.chance;
  if(r<total){sword=s;break;}
 }
 owned.push(sword.name);
 say("✨ "+sword.name+" 획득! 공격력 "+sword.power);
 updateUI();
}

function update(dt){
 move(dt);
 if(attackTimer>0)attackTimer-=dt;
 if(invincible>0)invincible-=dt;

 if(monster&&monster.alive){
  let dx=player.x-monster.x;
  let dy=player.y-monster.y;
  let d=Math.hypot(dx,dy);

  if(d>48){
   monster.x+=dx/d*45*dt;
   monster.y+=dy/d*45*dt;
  }else if(monster.attackWait<=0&&invincible<=0){
   hp-=8;
   invincible=.8;
   monster.attackWait=1.2;
   say(monster.name+"에게 공격받았다!");
   if(hp<=0){
    hp=100;
    player.x=400;player.y=250;
    coins=Math.max(0,coins-10);
    say("기절했다! 숲 입구에서 다시 시작합니다. 코인 10개를 잃었습니다.");
   }
   updateUI();
  }
  monster.attackWait-=dt;
 }
}

function loop(time){
 let dt=Math.min((time-lastTime)/1000||0,.04);
 lastTime=time;
 update(dt);
 render();
 requestAnimationFrame(loop);
}

document.addEventListener("keydown",e=>{
 let k=e.key.toLowerCase();
 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();
 keys[k==="arrowup"?"up":k==="arrowdown"?"down":k==="arrowleft"?"left":k==="arrowright"?"right":k]=true;
 if(k===" ")attack();
 if(k==="e")capture();
});
document.addEventListener("keyup",e=>{
 let k=e.key.toLowerCase();
 keys[k==="arrowup"?"up":k==="arrowdown"?"down":k==="arrowleft"?"left":k==="arrowright"?"right":k]=false;
});

document.querySelectorAll("[data-dir]").forEach(b=>{
 let dir=b.dataset.dir;
 b.addEventListener("pointerdown",e=>{e.preventDefault();keys[dir]=true;});
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>
 b.addEventListener(ev,()=>keys[dir]=false));
});

$("attack").onclick=attack;
$("capture").onclick=capture;
$("draw").onclick=drawSword;
$("explore").onclick=()=>{
 if(monster&&monster.alive){
  say("이미 몬스터와 전투 중입니다!");
  return;
 }
 spawnMonster();
};
$("heal").onclick=()=>{
 if(coins<20){say("코인이 부족합니다!");return;}
 if(hp>=100){say("체력이 이미 가득 찼습니다!");return;}
 coins-=20;hp=100;updateUI();say("체력을 모두 회복했습니다!");
};

$("save").onclick=saveGame;

$("reset").onclick=()=>{
 if(confirm("정말 새 게임을 시작할까요? 저장된 게임 기록이 삭제됩니다.")){
  localStorage.removeItem("swordCollectorSave");
  location.reload();
 }
};

function saveGame(){
 const data={coins,level,xp,hp,sword,owned,caught};
 localStorage.setItem("swordCollectorSave",JSON.stringify(data));
 say("💾 게임을 저장했습니다!");
}

function loadGame(){
 try{
  let d=JSON.parse(localStorage.getItem("swordCollectorSave"));
  if(!d)return;
  coins=d.coins??100;
  level=d.level??1;
  xp=d.xp??0;
  hp=d.hp??100;
  sword=d.sword??sword;
  owned=d.owned??[];
  caught=d.caught??[];
 }catch(e){console.log("저장 데이터 불러오기 실패");}
}

loadGame();
updateUI();
requestAnimationFrame(loop);
</script>
</body>
</html>
